services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kefu
      POSTGRES_PASSWORD: kefu
      POSTGRES_DB: kefu
    # Ports not exposed to host by default (use docker network only)
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kefu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://kefu:kefu@postgres:5432/kefu
      REDIS_URL: redis://redis:6379/0
      RAG_BACKEND: cloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional GPU worker for local Qwen inference.
  # Set QWEN_INFERENCE_URL=http://rag-worker:8001 in api service to use remote inference.
  # Without QWEN_INFERENCE_URL, local RAG runs in the api process (RAG_BACKEND=local + GPU deps).
  rag-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      RAG_BACKEND: local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    profiles:
      - gpu

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
